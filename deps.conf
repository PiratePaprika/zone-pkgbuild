# deps.conf — inter-package build-time dependencies for zone-pkgbuild/build.sh
#
# Format:  pkg-basename : dep1 dep2 ...
#
# Declares that <pkg-basename> must not start building until all listed deps
# have completed successfully.  Only needed for same-group build-order constraints.
#
# Audit result (2026-08-22):
#   core_pkgbuild/  — all 5 packages are independent
#   local_pkgbuild/ — all 8 packages are independent
#   3rdparty/       — all AUR packages are independent
#
# No entries required at this time.
